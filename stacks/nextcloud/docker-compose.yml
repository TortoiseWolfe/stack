x-deploy-defaults: &deploy-defaults
  replicas: 1
  update_config:
    order: stop-first
    parallelism: 1
    delay: 5s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 10s
    max_attempts: 0
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

x-deploy-stateless: &deploy-stateless
  replicas: 1
  update_config:
    order: start-first
    parallelism: 1
    delay: 5s
    failure_action: rollback
    monitor: 60s
  restart_policy:
    condition: any
    delay: 10s
    max_attempts: 0
  placement:
    constraints:
      - ${PLACEMENT_CONSTRAINT:-node.role == manager}

networks:
  traefik_net:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik_net}
  nextcloud_internal:
    driver: overlay
    attachable: false

configs:
  init_sh:
    # Bump when init.sh changes; Swarm configs are immutable.
    name: ${INIT_CONFIG_NAME:-nextcloud_init_1}
    file: ./scripts/init.sh

volumes:
  stt_whisper2_data:
  localai_models:
  nextcloud_html:
    driver: local
  nextcloud_db:
    driver: local

services:
  db:
    # POSTGRES_VERSION is not set in the stack env, so this default is what runs.
    # A bare `18` here re-opens digest drift; keep the digest when bumping.
    image: postgres:${POSTGRES_VERSION:-18@sha256:7157393f508fd8eb46119937fab39813783fe3e7d4c6316c45c12ce2ea25e61d}
    environment:
      POSTGRES_DB: ${DB_NAME:-nextcloud}
      POSTGRES_USER: ${DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
    volumes:
      # postgres:18 takes the volume one level up from 17 and earlier. Mounting
      # /var/lib/postgresql/data against 18 fails at startup with pg_upgrade advice
      # and no obvious error line. docker-library/postgres#37
      - nextcloud_db:/var/lib/postgresql
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nextcloud} -d ${DB_NAME:-nextcloud}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_DB:-1G}

  redis:
    # REDIS_VERSION is not set in the stack env either; same rule as db above.
    image: redis:${REDIS_VERSION:-7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD not set}", "--save", "", "--appendonly", "no"]
    environment:
      # Name has to match the healthcheck's ${REDIS_PASSWORD}, which the shell in
      # the container expands, not compose.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
    networks:
      - nextcloud_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_REDIS:-256M}

  app:
    image: nextcloud:${NEXTCLOUD_VERSION:?NEXTCLOUD_VERSION not set}
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME:-nextcloud}
      POSTGRES_USER: ${DB_USER:-nextcloud}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD not set}
      # Never "admin": the built-in account is disabled once this one exists.
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER:?ADMIN_USER not set}
      NEXTCLOUD_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
      NEXTCLOUD_TRUSTED_DOMAINS: ${DOMAIN:?DOMAIN not set}
      OVERWRITEHOST: ${DOMAIN:?DOMAIN not set}
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://${DOMAIN:?DOMAIN not set}
      # nextcloud/docker splits this value on spaces. Set this to the proxy
      # overlay subnet, not every RFC1918 range, on a shared host.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES not set}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT:-10G}
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-1024M}
      # Honoured at first install only; adopting object storage later is a data
      # migration. The image ignores the whole block when the bucket is unset.
      OBJECTSTORE_S3_BUCKET: ${S3_BUCKET:-}
      OBJECTSTORE_S3_HOST: ${S3_HOST:-}
      OBJECTSTORE_S3_PORT: ${S3_PORT:-443}
      OBJECTSTORE_S3_REGION: ${S3_REGION:-us-east-1}
      OBJECTSTORE_S3_KEY: ${S3_KEY:-}
      OBJECTSTORE_S3_SECRET: ${S3_SECRET:-}
      OBJECTSTORE_S3_SSL: ${S3_SSL:-true}
      OBJECTSTORE_S3_USEPATH_STYLE: ${S3_USE_PATH_STYLE:-true}
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - traefik_net
      - nextcloud_internal
    depends_on:
      - db
      - redis
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_APP:-2G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-app.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.${INSTANCE_NAME}-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-app.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-app.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-app.priority=10"
        - "traefik.http.services.${INSTANCE_NAME}-app.loadbalancer.server.port=80"
        # CalDAV/CardDAV clients probe /.well-known before anything else.
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.regex=https://(.*)/.well-known/(card|cal)dav"
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.replacement=https://$${1}/remote.php/dav/"
        - "traefik.http.middlewares.${INSTANCE_NAME}-dav.redirectregex.permanent=true"
        - "traefik.http.middlewares.${INSTANCE_NAME}-upload.buffering.maxRequestBodyBytes=${UPLOAD_MAX_BYTES:-10737418240}"
        - "traefik.http.middlewares.${INSTANCE_NAME}-security.headers.stsSeconds=15552000"
        - "traefik.http.middlewares.${INSTANCE_NAME}-security.headers.stsIncludeSubdomains=true"
        - "traefik.http.routers.${INSTANCE_NAME}-app.middlewares=${INSTANCE_NAME}-security@swarm,${INSTANCE_NAME}-dav@swarm,${INSTANCE_NAME}-upload@swarm"

  # Must share app's image and webroot volume. Without it no background job runs
  # and the admin overview shows a permanent cron warning.
  cron:
    image: nextcloud:${NEXTCLOUD_VERSION:?NEXTCLOUD_VERSION not set}
    entrypoint: ["/cron.sh"]
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - nextcloud_internal
    depends_on:
      - app
    deploy:
      <<: *deploy-defaults
      resources:
        limits:
          memory: ${MEM_LIMIT_CRON:-512M}

  # Installs the apps. Without it a deploy yields a stock Nextcloud: the `talk`
  # service is only the signaling backend, not the Talk app.
  init:
    image: nextcloud:${NEXTCLOUD_VERSION:?NEXTCLOUD_VERSION not set}
    user: www-data
    entrypoint: ["/bin/sh", "/init.sh"]
    configs:
      - source: init_sh
        target: /init.sh
        mode: 0555
    volumes:
      - nextcloud_html:/var/www/html
    networks:
      - nextcloud_internal
    environment:
      HOME: /tmp
      TZ: ${TZ:-America/New_York}
      DOMAIN: ${DOMAIN:?DOMAIN not set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      TALK_ENABLED: ${TALK_ENABLED:-true}
      TALK_HOST: ${TALK_HOST:?TALK_HOST not set}
      TURN_HOST: ${TURN_HOST:?TURN_HOST not set}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET not set}
      SIGNALING_SECRET: ${SIGNALING_SECRET:?SIGNALING_SECRET not set}
      # Call recording + the speech-to-text provider that turns it into a
      # transcript. Unset RECORDING_SECRET simply skips the whole block, so an
      # environment that has not created the secrets yet still boots clean.
      RECORDING_ENABLED: ${RECORDING_ENABLED:-true}
      RECORDING_SECRET: ${RECORDING_SECRET:-}
      RECORDING_URL: ${RECORDING_URL:-http://talk-recording:1234}
      STT_SECRET: ${STT_WHISPER2_SECRET:-}
      STT_HOST: ${STT_WHISPER2_HOST:-stt-whisper2}
      STT_PORT: ${STT_WHISPER2_PORT:-9030}
      STT_VERSION: ${STT_WHISPER2_VERSION:-2.5.0}
      LOCALAI_ENABLED: ${LOCALAI_ENABLED:-true}
      LOCALAI_URL: ${LOCALAI_URL:-http://localai:8080/v1}
      LOCALAI_STT_MODEL: ${LOCALAI_STT_MODEL:-whisper-base-en-q5_1}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD not set}
      MAIL_FROM: ${MAIL_FROM:-no-reply}
      MAIL_DOMAIN: ${MAIL_DOMAIN:?MAIL_DOMAIN not set}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER not set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD not set}
      ADMIN_ACCOUNTS: ${ADMIN_ACCOUNTS:-}
      MEMBER_ACCOUNTS: ${MEMBER_ACCOUNTS:-}
      EXTRA_APPS: ${EXTRA_APPS:-}
      # init asserts the primary-storage choice, so it needs the same variables
      # the app is configured from. Without these it reads them as empty and
      # either never fires or fires against an instance that is correct.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_HOST: ${S3_HOST:-}
      S3_KEY: ${S3_KEY:-}
      S3_SECRET: ${S3_SECRET:-}
    deploy:
      replicas: 1
      # Retried because a first boot can race `app` over the shared volume. The
      # cap is what makes failing loudly safe.
      restart_policy:
        condition: on-failure
        delay: 20s
        max_attempts: 6
      placement:
        constraints:
          - ${PLACEMENT_CONSTRAINT:-node.role == manager}
      resources:
        limits:
          memory: ${MEM_LIMIT_INIT:-512M}

  collabora:
    image: collabora/code:${COLLABORA_VERSION:?COLLABORA_VERSION not set}
    environment:
      aliasgroup1: https://${DOMAIN:?DOMAIN not set}:443
      server_name: ${DOMAIN:?DOMAIN not set}
      dictionaries: ${COLLABORA_DICTIONARIES:-en_US}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:logging.disable_server_audit=true --o:welcome.enable=false
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_COLLABORA:-2G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-office.rule=Host(`${DOMAIN}`) && (PathPrefix(`/browser`) || PathPrefix(`/hosting`) || PathPrefix(`/cool`))"
        - "traefik.http.routers.${INSTANCE_NAME}-office.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-office.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-office.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-office.priority=100"
        - "traefik.http.routers.${INSTANCE_NAME}-office.middlewares=${INSTANCE_NAME}-security@swarm"
        - "traefik.http.services.${INSTANCE_NAME}-office.loadbalancer.server.port=9980"

  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:${WHITEBOARD_VERSION:?WHITEBOARD_VERSION not set}
    environment:
      NEXTCLOUD_URL: https://${DOMAIN:?DOMAIN not set}
      # Must equal the whiteboard app's jwt_secret_key. A mismatch does not fail the
      # deploy; boards silently never connect.
      JWT_SECRET_KEY: ${JWT_SECRET:?JWT_SECRET not set}
      # Do NOT set STORAGE_STRATEGY=redis. The release build's Redis path exits with
      # "TypeError: RedisStrategy.createRedisClient is not a function".
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_WHITEBOARD:-512M}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-board.rule=Host(`${DOMAIN}`) && PathPrefix(`/whiteboard`)"
        - "traefik.http.routers.${INSTANCE_NAME}-board.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-board.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-board.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.routers.${INSTANCE_NAME}-board.priority=100"
        - "traefik.http.middlewares.${INSTANCE_NAME}-board-strip.stripprefix.prefixes=/whiteboard"
        - "traefik.http.routers.${INSTANCE_NAME}-board.middlewares=${INSTANCE_NAME}-security@swarm,${INSTANCE_NAME}-board-strip@swarm"
        - "traefik.http.services.${INSTANCE_NAME}-board.loadbalancer.server.port=3002"

  # Signaling and HPB only; relaying is the turn stack's job.
  talk:
    image: ${TALK_IMAGE:-strangewill/aio-talk-standalone}:${TALK_VERSION:-20260428}
    environment:
      NC_DOMAIN: ${DOMAIN:?DOMAIN not set}
      TALK_HOST: ${TALK_HOST:?TALK_HOST not set}
      # Janus mints ephemeral credentials against the shared relay, so these
      # three are the turn stack's values, not this container's.
      TURN_DOMAIN: ${TURN_HOST:?TURN_HOST not set}
      TALK_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET not set}
      SIGNALING_SECRET: ${SIGNALING_SECRET:?SIGNALING_SECRET not set}
      INTERNAL_SECRET: ${TALK_INTERNAL_SECRET:?TALK_INTERNAL_SECRET not set}
      AIO_LOG_LEVEL: ${TALK_LOG_LEVEL:-info}
      TZ: ${TZ:-America/New_York}
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          memory: ${MEM_LIMIT_TALK:-1G}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=${TRAEFIK_NETWORK:-traefik_net}"
        - "traefik.http.routers.${INSTANCE_NAME:?INSTANCE_NAME not set}-talk.rule=Host(`${TALK_HOST}`)"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.tls=true"
        - "traefik.http.routers.${INSTANCE_NAME}-talk.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-le}"
        - "traefik.http.services.${INSTANCE_NAME}-talk.loadbalancer.server.port=8081"

  # Records calls so Talk can transcribe them (#TBD). Nextcloud calls this over
  # nextcloud_internal, so it needs NO Traefik router and no public exposure.
  #
  # It joins the call as a participant by driving a headless Firefox, which makes
  # it the heaviest thing in this stack while a recording runs -- on a node that
  # also serves Drupal production and a second tenant's Nextcloud. The ceilings
  # below are the point, not decoration.
  talk-recording:
    image: ${TALK_RECORDING_IMAGE:-nextcloud/aio-talk-recording}:${TALK_RECORDING_VERSION:?TALK_RECORDING_VERSION not set}
    environment:
      NC_DOMAIN: ${DOMAIN:?DOMAIN not set}
      # The HPB is on its OWN host, not ${DOMAIN}. Left unset this silently
      # defaults to NC_DOMAIN and every recording fails to reach signaling.
      HPB_DOMAIN: ${TALK_HOST:?TALK_HOST not set}
      # EMPTY, not the image's /standalone-signaling/ default. The recorder
      # looks its signaling secret up by EXACT string match on the URL Nextcloud
      # reports (Config.getSignalingSecret: `signalingUrl.rstrip('/')` then
      # `in self._signalings`). Our spreed signaling_servers is the bare host
      # https://turn.chattanooga.digital, because the HPB has its own hostname;
      # AIO instead puts signaling on a path of the main domain, which is where
      # that default comes from. Left at the default the stored key is
      # ".../standalone-signaling", the lookup misses, there is no [signaling]
      # internalsecret to fall back to, and every recording dies with "No
      # configured signaling secret" AFTER the call has already started
      # (measured on production 2026-08-30).
      HPB_PATH: ${TALK_RECORDING_HPB_PATH:-}
      # Must equal the talk container's INTERNAL_SECRET. This is NOT
      # SIGNALING_SECRET and the two are not interchangeable.
      INTERNAL_SECRET: ${TALK_INTERNAL_SECRET:?TALK_INTERNAL_SECRET not set}
      # Must equal the secret in Nextcloud's spreed recording_servers config.
      RECORDING_SECRET: ${RECORDING_SECRET:?RECORDING_SECRET not set}
      AIO_LOG_LEVEL: ${TALK_LOG_LEVEL:-info}
      TZ: ${TZ:-America/New_York}
    networks:
      - traefik_net
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          cpus: "${CPU_LIMIT_TALK_RECORDING:-2.0}"
          memory: ${MEM_LIMIT_TALK_RECORDING:-2G}

  # Speech-to-text provider. Talk transcribes a finished recording automatically
  # once ANY transcription provider is registered -- this is that provider.
  #
  # Registered with AppAPI as "manual-install", deliberately: the alternative
  # ("docker-install") mounts the Docker socket into a container on a host that
  # is not ours, and AppAPI's own help calls the socket-proxy form deprecated and
  # scheduled for removal in Nextcloud 35.
  #
  # Upstream recommends 10-20 cores and warns it "will hog all cores by default".
  # Transcription here is a weekly batch job, so a hard cap costs minutes we do
  # not care about and protects a live client site we do.
  #
  # REPLICAS DEFAULTS TO 0. This was the experiment, not the answer. It is a
  # 16.3 GB image of CUDA libraries for a host with no GPU, it OOM-killed at a
  # 5G ceiling (exit 137), and at matched accuracy it is no faster than LocalAI,
  # which is 0.3 GB. Set STT_WHISPER2_REPLICAS=1 to bring it back for comparison.
  stt-whisper2:
    image: ${STT_WHISPER2_IMAGE:-ghcr.io/nextcloud/stt_whisper2}:${STT_WHISPER2_VERSION:-2.5.0}
    environment:
      APP_ID: stt_whisper2
      APP_DISPLAY_NAME: Local Whisper Speech To Text
      APP_VERSION: ${STT_WHISPER2_VERSION}
      APP_HOST: 0.0.0.0
      APP_PORT: ${STT_WHISPER2_PORT:-9030}
      # Must equal the "secret" field in the app_api:app:register JSON.
      APP_SECRET: ${STT_WHISPER2_SECRET:-}
      APP_PERSISTENT_STORAGE: /nc_app_stt_whisper2_data
      NEXTCLOUD_URL: https://${DOMAIN}
      # No NVIDIA hardware on this host despite the CUDA base image.
      COMPUTE_DEVICE: CPU
      TZ: ${TZ:-America/New_York}
    volumes:
      - stt_whisper2_data:/nc_app_stt_whisper2_data
    networks:
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      replicas: ${STT_WHISPER2_REPLICAS:-0}
      resources:
        limits:
          cpus: "${CPU_LIMIT_STT:-2.0}"
          memory: ${MEM_LIMIT_STT:-5G}

  # whisper.cpp behind an OpenAI-compatible API, as the transcription provider.
  #
  # This exists because stt_whisper2 was measured, on staging, at 28x slower than
  # real time even on its speed-optimised model -- about 28 hours of pegged CPU
  # for a one-hour meeting -- and it OOM-killed (exit 137) at a 5G ceiling. Its
  # image is 16.3 GB of CUDA libraries for a host with no GPU.
  #
  # This image is 0.3 GB and the default whisper-1 model is whisper.cpp's
  # quantised ggml-base.bin, ~140 MB. Nextcloud reaches it through the
  # integration_openai app, which defaults its transcription model to exactly
  # that name.
  #
  # No Traefik router: Nextcloud calls it over nextcloud_internal, and nothing
  # outside the stack has any business reaching an inference endpoint.
  localai:
    image: ${LOCALAI_IMAGE:-localai/localai}:${LOCALAI_VERSION:?LOCALAI_VERSION not set}
    environment:
      # Threads must stay at or under the CPU limit below, or whisper.cpp
      # oversubscribes and gets slower rather than faster.
      LOCALAI_THREADS: ${LOCALAI_THREADS:-2}
      LOCALAI_CONTEXT_SIZE: ${LOCALAI_CONTEXT_SIZE:-512}
      LOCALAI_MODELS_PATH: /models
      LOCALAI_LOG_LEVEL: ${LOCALAI_LOG_LEVEL:-info}
      TZ: ${TZ:-America/New_York}
    volumes:
      - localai_models:/models
    networks:
      - nextcloud_internal
    deploy:
      <<: *deploy-stateless
      resources:
        limits:
          cpus: "${CPU_LIMIT_LOCALAI:-2.0}"
          memory: ${MEM_LIMIT_LOCALAI:-2G}
